name: Replay OCF Database on LocalNet
run-name: OCF LocalNet replay (${{ inputs.database }}${{ inputs.target_sha && format(' at {0}', inputs.target_sha) || '' }})

on:
  workflow_dispatch:
    inputs:
      database:
        description: Read-only OCF database snapshot to replay
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production
      target_sha:
        description: Exact contract commit SHA to test
        required: false
        type: string
      portal_id:
        description: Optional portal UUID to restrict the replay to
        required: false
        type: string
      report_prefix:
        description: Optional artifact/report subdirectory suffix
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ocf-localnet-replay-${{ inputs.database }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    steps:
      - name: Validate request
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          PORTAL_ID: ${{ inputs.portal_id }}
        run: |
          if [ "${{ inputs.database }}" = "production" ]; then
            echo "Production replay protection is enforced by the production-data environment (required reviewer + deployment branch policy)."
          fi
          if [ -n "$TARGET_SHA" ] && ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be an exact lowercase 40-character Git commit SHA when provided."
            exit 1
          fi
          if [ -n "$PORTAL_ID" ] && ! [[ "$PORTAL_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::portal_id must be a UUID when provided."
            exit 1
          fi

  replay:
    needs: validate-request
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Production replays are protected by the production-data environment (required reviewer
    # HardlyDifficult + deployment branch policy), not by an in-workflow ref check.
    environment:
      name: ${{ inputs.database == 'production' && 'production-data' || 'development-data' }}
    env:
      CANTON_LOCALNET_AUTH_MODE: shared-secret
      CANTON_LOCALNET_INFRA_ONLY: 'true'
      CANTON_LOCALNET_QUICKSTART_REF: 5c90cf4d0eb934712fd8c269b56e6272b605ccad
      CANTON_DEBUG: 'false'
      DISABLE_FILE_LOGGER: 'true'
      OCP_REPLAY_REPORT_DIR: ${{ inputs.report_prefix != '' && format('artifacts/ocf-localnet-replay/{0}', inputs.report_prefix) || 'artifacts/ocf-localnet-replay' }}
      OCP_REPLAY_PORTAL_ID: ${{ inputs.portal_id }}

    steps:
      - name: Checkout contracts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Exact-sha replays test that contract commit; branch dispatches replay the dispatching branch's rules.
          ref: ${{ inputs.target_sha != '' && inputs.target_sha || github.ref }}
          lfs: true
          persist-credentials: false
          submodules: false

      - name: Record tested contract commit
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          if [ -n "$TARGET_SHA" ] && [ "$actual_sha" != "$TARGET_SHA" ]; then
            echo "::error::Checked out $actual_sha instead of requested $TARGET_SHA."
            exit 1
          fi
          echo "OCP_REPLAY_TARGET_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "Tested contract SHA: \`$actual_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Configure npm retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000

      - name: Upgrade npm
        run: npm install --global npm@11.10.0

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: '23'

      - name: Install npm dependencies
        run: npm install

      - name: Record committed package.json hash
        id: package-json
        run: echo "hash=$(sha256sum package.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # Pre-cutover target_sha values still build against the Splice git submodule.
      - name: Initialize contract submodules
        run: |
          if grep -q 'path = libs/splice' .gitmodules 2>/dev/null; then
            git submodule update --init --recursive --depth 1 libs/splice
          else
            echo "No libs/splice submodule at this target_sha; skipping"
          fi

      - name: Restore Daml SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.dpm
          key: dpm-sdk-${{ runner.os }}-${{ steps.package-json.outputs.hash }}-${{ hashFiles('**/daml.yaml') }}
          restore-keys: |
            dpm-sdk-${{ runner.os }}-

      # LocalNet CLI must not depend on whether target_sha already includes the ENG-1635 cutover.
      # Prefer the version pinned in package.json (installed by npm i); only add it for older SHAs.
      - name: Ensure LocalNet CLI
        run: |
          set -euo pipefail
          if test -x ./node_modules/.bin/canton-dev-tools; then
            echo "canton-dev-tools already installed from package.json"
          else
            dev_tools_ver=$(node -p "require('./package.json').devDependencies?.['@fairmint/canton-dev-tools'] ?? require('./package.json').dependencies?.['@fairmint/canton-dev-tools'] ?? '0.1.3'")
            node_sdk_ver=$(node -p "require('./package.json').dependencies?.['@fairmint/canton-node-sdk'] ?? '0.0.232'")
            npm install "@fairmint/canton-dev-tools@${dev_tools_ver}" "@fairmint/canton-node-sdk@${node_sdk_ver}"
          fi
          test -x ./node_modules/.bin/canton-dev-tools

      - name: Install Daml SDKs
        run: |
          set -euo pipefail
          if ./node_modules/.bin/canton-dev-tools --help 2>&1 | grep -q install-dpm-sdks; then
            npm exec canton-dev-tools -- install-dpm-sdks
          elif test -x scripts/install-dpm-sdks.sh; then
            bash scripts/install-dpm-sdks.sh
          else
            echo "::error::No SDK install path available for this target_sha"
            exit 1
          fi
          echo "$HOME/.dpm/bin" >> "$GITHUB_PATH"

      - name: Build selected contracts and bindings
        run: npm run codegen

      - name: Test replay planner and generated package
        run: npm run verify-package

      - name: Validate environment-scoped database secret
        env:
          OCP_REPLAY_DATABASE_URL: ${{ secrets.OCP_REPLAY_DATABASE_URL }}
        run: |
          if [ -z "$OCP_REPLAY_DATABASE_URL" ]; then
            echo "::error::The selected protected GitHub environment must define an OCP_REPLAY_DATABASE_URL secret for a dedicated read-only role."
            exit 1
          fi

      - name: Restore LocalNet asset cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/fairmint/canton-localnet
          key: canton-localnet-${{ runner.os }}-${{ steps.package-json.outputs.hash }}-${{ env.CANTON_LOCALNET_QUICKSTART_REF }}
          restore-keys: |
            canton-localnet-${{ runner.os }}-

      - name: Start LocalNet
        run: ./node_modules/.bin/canton-dev-tools start
        timeout-minutes: 45

      - name: Smoke test LocalNet
        run: ./node_modules/.bin/canton-dev-tools smoke

      - name: Verify cross-participant traffic accounting
        run: npm run test:localnet-traffic
        timeout-minutes: 10

      - name: Replay every committed OCF object
        id: replay
        env:
          POSTGRES_DB_URL: ${{ secrets.OCP_REPLAY_DATABASE_URL }}
          POSTGRES_SSL_CA: ${{ secrets.OCP_REPLAY_SSL_CA }}
        run: |
          set +e
          replay_args=(--database "${{ inputs.database }}" --report-dir "$OCP_REPLAY_REPORT_DIR")
          if [ -n "$OCP_REPLAY_PORTAL_ID" ]; then
            replay_args+=(--portal-id "$OCP_REPLAY_PORTAL_ID")
          fi
          GITHUB_SHA="$OCP_REPLAY_TARGET_SHA" npm run replay-ocf:localnet -- "${replay_args[@]}" \
            > "$RUNNER_TEMP/ocf-replay.log" 2>&1
          replay_status=$?
          set -e
          if [ "$replay_status" -ne 0 ]; then
            echo "::error::OCF replay failed. See the sanitized replay report artifact for details."
          fi
          exit "$replay_status"
        timeout-minutes: 120

      # Canton command logs may contain submitted OCF payloads. Only inspect them when replay never started.
      - name: Show LocalNet startup logs
        if: failure() && steps.replay.outcome == 'skipped'
        run: ./node_modules/.bin/canton-dev-tools diagnostics || true

      # The replay log intentionally omits customer identifiers and payload values; this step
      # derives a payload-free per-phase failure count from the ::error workflow commands.
      - name: Extract sanitized failure summary from replay log
        if: always()
        run: |
          set +e
          mkdir -p "$OCP_REPLAY_REPORT_DIR"
          grep -oE '::error title=OCP LocalNet replay \([a-z-]+\)' "$RUNNER_TEMP/ocf-replay.log" \
            | sort | uniq -c | sort -rn \
            > "$OCP_REPLAY_REPORT_DIR/failure-phases.txt" || true
          set -e

      - name: Upload sanitized replay report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ocf-localnet-replay-${{ inputs.database }}-${{ inputs.report_prefix || github.run_id }}
          path: ${{ inputs.report_prefix != '' && format('artifacts/ocf-localnet-replay/{0}/', inputs.report_prefix) || 'artifacts/ocf-localnet-replay/' }}
          if-no-files-found: warn
          retention-days: 7

      - name: Stop LocalNet
        if: always()
        run: |
          ./node_modules/.bin/canton-dev-tools stop || true
          docker volume prune --force || true
